<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Movie - CineTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <h1>CineTrack</h1>
      <nav><a href="/">Back to library</a></nav>
    </header>

    <main>
      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
        hidden
      ></div>

      <section class="panel" id="edit-panel" hidden>
        <h2>Edit movie</h2>
        <p class="original-box" id="original-values"></p>

        <form id="edit-form" novalidate>
          <div class="form-grid">
            <label
              >Title
              <input type="text" id="title" maxlength="100" />
            </label>
            <label
              >Genre
              <input type="text" id="genre" maxlength="100" />
            </label>
            <label
              >Year
              <input type="number" id="year" min="1888" />
            </label>
            <label
              >Status
              <select id="status">
                <option value="Planned">Planned</option>
                <option value="Watching">Watching</option>
                <option value="Watched">Watched</option>
              </select>
            </label>
            <label
              >Rating
              <select id="rating">
                <option value="0">Not rated</option>
                <option value="1">★☆☆☆☆ (1)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="5">★★★★★ (5)</option>
              </select>
            </label>
          </div>
          <label
            >My review
            <textarea
              id="review"
              rows="5"
              maxlength="1000"
              placeholder="What did you think?"
            ></textarea>
          </label>
          <label>Poster link
            <input type="url" id="poster" maxlength="500" placeholder="https://example.com/poster.jpg" />
          </label>
          <button type="submit" class="btn btn-primary">Save changes</button>
          <a href="/" class="btn">Cancel</a>
        </form>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="edit.js"></script>
  </body>
</html>
